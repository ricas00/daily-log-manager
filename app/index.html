<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Daily Log</title>
<style>
  :root {
    --bg: #101418; --card: #1a2129; --card2: #212a34;
    --fg: #e8edf2; --muted: #8b98a5; --accent: #5aa9ff;
    --ok: #4cc38a; --danger: #e5484d; --border: #2c3742;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px; margin-inline: auto;
  }
  header { display: flex; align-items: baseline; gap: 8px; margin: 4px 2px 14px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  header .date { color: var(--muted); font-size: 14px; }
  .bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .bar input[type=date] {
    flex: 1; min-width: 0; background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; font: inherit; color-scheme: dark;
  }
  .bar button {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; font: inherit; font-size: 14px;
  }
  .bar button:active { background: var(--card2); }
  form#add {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; display: grid; gap: 8px; margin-bottom: 18px;
  }
  .row { display: flex; gap: 8px; }
  input, textarea, select {
    background: var(--card2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; width: 100%; min-width: 0;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 42px; }
  form#add button[type=submit] {
    background: var(--accent); color: #08111c; border: 0; border-radius: 10px;
    padding: 12px; font: inherit; font-weight: 600;
  }
  form#add button[type=submit]:active { filter: brightness(.9); }
  ul#list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li.entry {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 12px 10px;
  }
  .entry .top { display: flex; align-items: baseline; gap: 8px; }
  .entry .time { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 14px; flex: none; }
  .entry .title { font-weight: 600; word-break: break-word; flex: 1; }
  .entry .cat {
    color: var(--muted); font-size: 12px; border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px; flex: none;
  }
  .entry .notes { color: var(--muted); font-size: 14px; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .entry .meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .entry .src { font-size: 12px; color: var(--muted); }
  .entry .src.suggested { color: var(--ok); }
  .entry .del {
    margin-left: auto; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 13px; padding: 4px 6px;
  }
  .entry .del:active { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; font-size: 15px; }
  .err { color: var(--danger); font-size: 14px; min-height: 0; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
  #gate[hidden] { display: none; }
  .gate-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 360px; display: grid; gap: 12px; }
  .gate-card h2 { margin: 0; font-size: 20px; }
  .gate-card p { margin: 0; color: var(--muted); font-size: 14px; }
  .gate-card form { display: grid; gap: 10px; }
  .gate-card button { background: var(--accent); color: #08111c; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>Daily Log</h1>
    <span class="date" id="today"></span>
  </header>

  <div class="bar">
    <input type="date" id="day" aria-label="Day">
    <button type="button" id="todayBtn">Today</button>
  </div>

  <form id="add" autocomplete="off">
    <div class="row">
      <input type="time" id="time" aria-label="Time" required>
      <select id="category" aria-label="Category">
        <option>general</option><option>work</option><option>dev</option>
        <option>meeting</option><option>health</option><option>personal</option>
      </select>
    </div>
    <input type="text" id="title" maxlength="300" placeholder="What happened?" required>
    <textarea id="notes" maxlength="2000" rows="2" placeholder="Notes (optional)"></textarea>
    <button type="submit">Add event</button>
    <div class="err" id="err"></div>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>Nothing logged this day yet.</div>

  <div id="gate" hidden>
    <div class="gate-card">
      <h2>Daily Log</h2>
      <p>Enter the passcode to continue. It is stored only in this browser.</p>
      <form id="gateForm" autocomplete="off">
        <input type="password" id="token" placeholder="Passcode" autocomplete="off" required>
        <button type="submit">Unlock</button>
        <div class="err" id="gateErr"></div>
      </form>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const today = () => new Date().toISOString().slice(0, 10);
const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

// --- passcode gate -------------------------------------------------------
const gate = $("gate");
const gateErr = $("gateErr");
const gateForm = $("gateForm");
const tokenInput = $("token");
let token = localStorage.getItem("dailog_token") || "";

function authHeaders() {
  return token ? { "Authorization": "Bearer " + token } : {};
}

function showGate() {
  gate.hidden = false;
  tokenInput.value = "";
}

function hideGate() {
  gate.hidden = true;
}

async function unlock() {
  const t = tokenInput.value.trim();
  if (!t) return;
  gateErr.textContent = "";
  const res = await fetch(`/api/entries?day=${encodeURIComponent($("day").value)}`, {
    headers: { "Authorization": "Bearer " + t },
  });
  if (res.ok) {
    token = t;
    localStorage.setItem("dailog_token", t);
    hideGate();
    load();
  } else {
    gateErr.textContent = "Wrong passcode — try again.";
  }
}

gateForm.addEventListener("submit", (ev) => { ev.preventDefault(); unlock(); });

// --- app -----------------------------------------------------------------
$("today").textContent = new Date().toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"});
$("day").value = today();
const now = new Date();
$("time").value = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

let entries = [];

async function load() {
  const res = await fetch(`/api/entries?day=${encodeURIComponent($("day").value)}`, {
    headers: authHeaders(),
  });
  if (res.status === 401) { showGate(); return; }
  const data = await res.json();
  entries = data.entries || [];
  render();
}

function render() {
  const list = $("list");
  list.innerHTML = "";
  $("empty").hidden = entries.length > 0;
  for (const e of entries) {
    const li = document.createElement("li");
    li.className = "entry";

    const t = new Date(e.time);
    const timeTxt = isNaN(t) ? e.time.slice(0, 16) : t.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});

    const top = document.createElement("div"); top.className = "top";
    const time = document.createElement("span"); time.className = "time"; time.textContent = timeTxt;
    const title = document.createElement("span"); title.className = "title"; title.textContent = e.title;
    const cat = document.createElement("span"); cat.className = "cat"; cat.textContent = e.category;
    top.append(time, title, cat);
    li.appendChild(top);

    if (e.notes) {
      const n = document.createElement("div"); n.className = "notes"; n.textContent = e.notes;
      li.appendChild(n);
    }

    const meta = document.createElement("div"); meta.className = "meta";
    const src = document.createElement("span"); src.className = "src" + (e.source === "suggested" ? " suggested" : "");
    src.textContent = e.source === "suggested" ? "suggested" : "manual";
    const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "delete";
    del.onclick = async () => {
      await fetch(`/api/entries?day=${encodeURIComponent(e.time.slice(0,10))}&id=${e.id}`, {method: "DELETE", headers: authHeaders()});
      load();
    };
    meta.append(src, del);
    li.appendChild(meta);
    list.appendChild(li);
  }
}

$("add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("err").textContent = "";
  const day = $("day").value || today();
  const body = {
    time: new Date(`${day}T${$("time").value || "00:00"}`).toISOString(),
    title: $("title").value.trim(),
    category: $("category").value,
    notes: $("notes").value.trim(),
    source: "manual",
  };
  const res = await fetch("/api/entries", {
    method: "POST",
    headers: {"Content-Type": "application/json", ...authHeaders()},
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    $("err").textContent = d.error || "Failed to add entry";
    return;
  }
  $("title").value = ""; $("notes").value = "";
  load();
});

$("day").addEventListener("change", load);
$("todayBtn").addEventListener("click", () => { $("day").value = today(); load(); });
load();
</script>
</body>
</html>
